name: saloni_staff
description: "صالوني — الطاقم: تطبيق الحلاق والمدير (Saloni staff app)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # ق41: لإجبار الأرقام الغربية في تنسيق التواريخ تحت لغة `ar` (يثبّت إصداره flutter_localizations).
  intl: any
  saloni_ui:
    path: ../../packages/saloni_ui
  saloni_api:
    path: ../../packages/saloni_api
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_foreground_task: ^8.17.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  drift: ^2.20.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  # «عن التطبيق»: الاتصال بالمطوّر (tel:) — الإصدار نفسه في تطبيق الزبون.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # الخطوط وتراخيصها (OFL) من saloni_ui مباشرة (`packages/saloni_ui/…`)؛
  # `registerSaloniFontLicenses()` في main يعرض التراخيص في صفحة التراخيص.
