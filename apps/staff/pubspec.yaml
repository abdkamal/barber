name: saloni_staff
description: "صالوني — الطاقم: تطبيق الحلاق والمدير (Saloni staff app)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  saloni_ui:
    path: ../../packages/saloni_ui
  saloni_api:
    path: ../../packages/saloni_api
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.3
  flutter_foreground_task: ^8.17.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  drift: ^2.20.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # خطوط نظام التصميم: saloni_ui يسجّلها باسم «packages/saloni_ui/…» بينما أنماطه
  # تطلبها بالاسم المجرد فلا تُطبَّق. حل مؤقت: نسخة مطابقة من ملفات الحزمة (مع
  # تراخيص OFL) مسجّلة هنا بالاسم المجرد (انظر README → تغييرات مطلوبة في الحزم).
  assets:
    - assets/fonts/licenses/
  fonts:
    - family: El Messiri
      fonts:
        - asset: assets/fonts/ElMessiri.ttf
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
