<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>احجز دورك</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/saloni/tokens.css">
<link rel="stylesheet" href="ds/saloni/components/bundle.css">
<script src="ds/saloni/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0e1726;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:#eaf1f8}
a{color:#8cc8e6}a:hover{color:#b3dcf0}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1180px; box-sizing: border-box; background: var(--surface); color: var(--ink); font-family: var(--font-text); display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 8px"><div style="flex-grow: 1"><h1 style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 34px">احجز دورك</h1><p style="margin: 0; font-size: 13px; line-height: 20px; color: var(--ink-muted)">صالون الراحة · اليوم الأربعاء</p></div></header>
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 8px 16px 16px; overflow: hidden">
  <section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 28px">الخدمات</h2><x-import component-from-global-scope="Saloni.ServiceChip" name="حلاقة شعر" minutes="{{n38}}" price="40"></x-import><x-import component-from-global-scope="Saloni.ServiceChip" name="شعر ولحية" minutes="{{n45}}" price="60" selected="{{yes}}"></x-import><x-import component-from-global-scope="Saloni.ServiceChip" name="حلاقة أطفال" minutes="{{n38}}" price="30"></x-import><p style="margin: 0; font-size: 13px; color: var(--ink-subtle)">يمكنك اختيار أكثر من خدمة.</p></section>
  <section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 28px">الحلاق</h2><x-import component-from-global-scope="Saloni.BarberOption" fastest="{{yes}}" next-at="10:40" wait="بعد 25 د" selected="{{yes}}"></x-import><x-import component-from-global-scope="Saloni.BarberOption" name="خالد الحربي" next-at="10:55" wait="بعد 40 د"></x-import><x-import component-from-global-scope="Saloni.BarberOption" name="سعد العمري" unavailable="{{yes}}" reason="لا يعمل اليوم"></x-import></section>
  <section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 28px">الوقت</h2><x-import component-from-global-scope="Saloni.SegmentedControl" label="نوع الحجز" options="{{bookOpts}}"></x-import><p style="margin: 0; font-size: 13px; line-height: 20px; color: var(--ink-subtle)">«أقرب دور» يضعك في أول وقت متاح. «ساعة محددة» تحجز لك ساعة تختارها اليوم.</p></section>
</main>
<div style="padding: 12px 16px 20px; background: var(--surface); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px"><div style="display: flex; justify-content: space-between; align-items: baseline"><span style="color: var(--ink-muted); font-size: 14px">الوقت المتوقع</span><span style="font-family: var(--font-display); font-size: 22px; font-weight: 600">10:40 ص</span></div>
<p style="margin: 0; font-size: 13px; color: var(--ink-muted)">شعر ولحية · نحو 45 دقيقة · 60 ر.س · الدفع في الصالون</p>
<a href="C-Track.dc.html" class="dw-btn dw-btn-primary dw-btn-lg dw-btn-block" style="text-decoration: none; box-sizing: border-box"><span>احجز دوري</span></a>
<p style="margin: 0; font-size: 12px; line-height: 18px; color: var(--ink-subtle); text-align: center">معاينة: <a href="C-Offer.dc.html" style="color: var(--steel)">طلب ساعة غير متاحة</a></p></div>
</div>
</x-dc>

</body>
</html>
