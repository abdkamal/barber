<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ملف الصالون</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/saloni/tokens.css">
<link rel="stylesheet" href="ds/saloni/components/bundle.css">
<script src="ds/saloni/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0e1726;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:#eaf1f8}
a{color:#8cc8e6}a:hover{color:#b3dcf0}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1280px; box-sizing: border-box; background: var(--surface); color: var(--ink); font-family: var(--font-text); display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 8px"><div style="flex-grow: 1"><h1 style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 34px">ملف الصالون</h1><p style="margin: 0; font-size: 13px; line-height: 20px; color: var(--ink-muted)">يظهر للزبائن في «حول الصالون»</p></div></header>
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 8px 16px 12px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px"><span style="width: 64px; height: 64px; border-radius: 16px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 28px">ر</span><x-import component-from-global-scope="Saloni.Button" variant="secondary" size="sm" icon="image">تغيير الشعار</x-import></div>
  <x-import component-from-global-scope="Saloni.TextField" label="اسم الصالون" value="صالون الراحة"></x-import>
  <x-import component-from-global-scope="Saloni.TextField" label="النبذة" value="صالون رجالي في حي النرجس منذ 2015."></x-import>
  <x-import component-from-global-scope="Saloni.TextField" label="العنوان" value="الرياض — حي النرجس، طريق أنس بن مالك"></x-import>
  <x-import component-from-global-scope="Saloni.Button" variant="secondary" icon="map-pin" block="{{yes}}">تحديد الموقع من مكاني الحالي</x-import>
  <x-import component-from-global-scope="Saloni.TextField" label="واتساب" prefix="+966" dir="ltr" value="55 000 0000"></x-import>
  <section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 28px">الخدمات والمنتجات</h2><x-import component-from-global-scope="Saloni.CatalogItem" kind="service" name="شعر ولحية" price="60" minutes="{{n45}}" description="قص الشعر مع تهذيب اللحية."></x-import><x-import component-from-global-scope="Saloni.CatalogItem" kind="product" name="واكس تصفيف مطفي" price="45" description="ثبات متوسط."></x-import><x-import component-from-global-scope="Saloni.Button" variant="ghost" icon="plus" block="{{yes}}">إضافة خدمة أو منتج</x-import></section>
</main>
<x-import component-from-global-scope="Saloni.BottomNav" items="{{navManager}}" active="{{n2}}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1280}}'>

        { name: 'ريان', from: '10:50 م', to: '11:25 م', pastClosing: true }],
      revSeries: [640, 910, 720, 1120, 860, 1010, 1240], accSeries: [12, 10, 9, 8, 8, 7, 7]
    };
  }
}
</script>
</body>
</html>
